version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthcare_navigator_db
    restart: always
    environment:
      POSTGRES_DB: healthcare_navigator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare_navigator_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/healthcare_navigator
      - SECRET_KEY=super_secret_jwt_key_healthcare_schemes_navigator_2026_prod
      - ADMIN_EMAIL=admin@healthcare.gov.in
      - ADMIN_PASSWORD=admin123
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare_navigator_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
